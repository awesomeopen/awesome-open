<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>OpenTofu — specimen comparison</title><link rel="stylesheet" href="vendor/fonts.css"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="styles.css">
<style>
body{background:white;color:#0b2546;margin:0}.comparison-shell{max-width:1280px;margin:auto;padding:32px 24px}.comparison-head{margin-bottom:28px}.comparison-head h1{font:300 clamp(30px,4vw,48px)/1.1 var(--rs-display);margin:16px 0}.comparison-head p{font:13px/1.6 var(--mono);max-width:65ch}.comparison-head>a{font:12px var(--mono)}
.comparison-controls{display:flex;flex-wrap:wrap;gap:12px;border:0;padding:0;margin:24px 0}.comparison-controls legend{font:11px var(--mono);margin-bottom:12px}.comparison-controls label{display:flex;align-items:center;gap:10px;border:1px solid #0b2546;padding:12px 16px;font:13px var(--mono);cursor:pointer}.comparison-controls label:has(:checked){background:#0b2546;color:white}.comparison-controls input{accent-color:#bd302c}.comparison-controls label:focus-within{outline:2px solid #bd302c;outline-offset:4px}
.comparison-shell .specimen-plate{padding:24px 24px 40px;gap:32px 48px}.comparison-shell .plate-heading{margin-bottom:0}.comparison-shell .plate-art-stage{width:100%;max-width:480px;aspect-ratio:1;margin:0 auto;border:0;isolation:isolate}.comparison-shell .plate-art-stage:after{display:none}.comparison-shell .plate-art-stage:before{content:'';position:absolute;z-index:-1;left:25%;top:20%;width:56%;height:66%;background:#dce6ed}
.comparison-shell .plate-art{position:relative;left:auto;top:auto;margin:0;width:100%;max-width:none;mix-blend-mode:normal;animation:none!important}.comparison-shell .plate-art img{display:block;width:100%;height:auto;max-height:none;mix-blend-mode:normal;clip-path:url(#pod-contour)}
.comparison-shell:has(#treatment-rule:checked) .plate-art-stage:before{left:0;top:46%;width:100%;height:2px;background:#0b2546}
.comparison-shell .plate-leader{display:none}.comparison-shell .plate-detail{grid-template-columns:104px minmax(0,1fr);gap:20px;margin:20px 0 0}.comparison-shell .plate-detail-crop{height:104px;width:104px;aspect-ratio:1}.comparison-shell .plate-detail-crop img{width:380%;left:-207%;top:-190%}.comparison-shell .plate-detail strong{font-size:22px}.comparison-shell .plate-detail figcaption{padding:0}.comparison-shell .plate-detail p{margin-top:8px}
@media(max-width:720px){.comparison-shell{padding:20px 12px}.comparison-shell .specimen-plate{padding:20px 12px;gap:24px}.comparison-controls{gap:8px}.comparison-controls label{padding:10px;font-size:12px}.comparison-shell .plate-art-stage{max-width:420px}.comparison-shell .plate-detail{grid-template-columns:88px minmax(0,1fr);gap:14px}.comparison-shell .plate-detail-crop{width:88px;height:88px}.comparison-shell .plate-detail strong{font-size:20px}}
</style></head><body>__CONTOUR__<main class="comparison-shell"><header class="comparison-head"><a href="./">← Field guide</a><h1>OpenTofu / two compositions</h1><p>Same specimen, scale and feature note. Switch the treatment to compare the background and interrupted rule.</p><fieldset class="comparison-controls"><legend>Plate treatment</legend><label><input type="radio" name="treatment" id="treatment-field" checked>A / Bounded background</label><label><input type="radio" name="treatment" id="treatment-rule">B / Interrupted rule</label></fieldset></header><div class="specimen-drawer">__PLATE__</div></main></body></html>
