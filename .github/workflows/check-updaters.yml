name: Check README source and preview

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Run offline tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Render source preview from cached snapshots
        run: |
          python3 scripts/render_readme.py --output tmp/readme-preview/README.md
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import os

          preview = Path('tmp/readme-preview')
          before = Path('README.md').read_text(encoding='utf-8').splitlines(keepends=True)
          after = (preview / 'README.md').read_text(encoding='utf-8').splitlines(keepends=True)
          diff = ''.join(difflib.unified_diff(before, after, fromfile='tracked/README.md', tofile='preview/README.md'))
          (preview / 'README.diff').write_text(diff, encoding='utf-8')
          summary = ('## Offline README preview\n\n'
                     'Rendered from this commit’s curated source and cached evidence. '
                     'Metrics for new repositories are omitted until publication refreshes the snapshot. '
                     'HN identity-map edits use prior cached evidence until the publisher refreshes it.\n\n'
                     'Download the `readme-preview` artifact for README.md, HN chart assets, and README.diff. '
                     'Content PRs edit README.source.md; they do not need to commit generated README changes.\n')
          (preview / 'PREVIEW.md').write_text(summary, encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(summary)
          PY
      - name: Upload README preview
        uses: actions/upload-artifact@v4
        with:
          name: readme-preview
          path: tmp/readme-preview/
          if-no-files-found: error
      - name: Build offline field-guide preview
        run: |
          python3 scripts/build_site.py --output tmp/site --source-sha "$GITHUB_SHA"
          python3 scripts/build_exhibition_preview.py --output tmp/site
          python3 scripts/build_jar_preview.py --output tmp/site
      - name: Upload field-guide preview
        uses: actions/upload-artifact@v4
        with:
          name: field-guide-preview
          path: tmp/site/
          if-no-files-found: error
      - name: Install browser-check dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Check the generated field guide in Chromium
        timeout-minutes: 5
        env:
          SITE_URL: http://127.0.0.1:8000
          SITE_SOURCE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p tmp/site-qa
          python3 -u -m http.server 8000 --bind 127.0.0.1 --directory tmp/site > tmp/site-qa/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request

          for attempt in range(40):
              try:
                  with urllib.request.urlopen(os.environ['SITE_URL'], timeout=1) as response:
                      if response.status == 200:
                          break
              except (urllib.error.URLError, TimeoutError):
                  pass
              time.sleep(0.25)
          else:
              raise SystemExit('The local field-guide preview did not become ready')
          PY
          timeout 180s node scripts/check_site_browser.cjs 2>&1 | tee tmp/site-qa/browser.log
          timeout 90s node scripts/check_exhibition_browser.cjs 2>&1 | tee tmp/site-qa/exhibition.log
          timeout 90s node scripts/check_jar_browser.cjs 2>&1 | tee tmp/site-qa/jars.log
      - name: Upload desktop and mobile browser screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: field-guide-browser-screenshots
          path: tmp/site-qa/
          if-no-files-found: warn
          retention-days: 14
