name: Publish generated README

on:
  push:
    branches: [main]
    paths:
      - 'README.source.md'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/update-stats.yml'
      - '.github/workflows/check-updaters.yml'
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC.
  workflow_dispatch:

permissions:
  contents: write

# All event types share one writer. Runs always fetch current main rather than
# publishing from their triggering SHA, including a replaced pending run.
concurrency:
  group: publish-readme-main
  cancel-in-progress: false

jobs:
  publish-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect, validate, render and publish current main
        run: python3 scripts/publish_readme.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
