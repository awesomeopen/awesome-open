name: Publish README and field guide

on:
  push:
    branches: [main]
    paths:
      - 'README.source.md'
      - 'data/**'
      - 'scripts/**'
      - 'site/**'
      - 'assets/hn/**'
      - '.github/workflows/update-stats.yml'
      - '.github/workflows/check-updaters.yml'
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC.
  workflow_dispatch:
    inputs:
      history_backfill:
        description: One bounded history-backfill chunk (resume by dispatching again)
        type: boolean
        default: false

permissions:
  contents: read

# All event types share one writer. Runs always fetch current main rather than
# publishing from their triggering SHA, including a replaced pending run.
concurrency:
  group: publish-readme-main
  cancel-in-progress: false

jobs:
  publish-readme:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.history_backfill && 45 || 30 }}
    permissions:
      contents: write
    outputs:
      published_sha: ${{ steps.publish.outputs.published_sha }}
      build_attempt: ${{ steps.publish.outputs.build_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Backfill missing aggregate histories (at most 15 minutes)
        if: github.event_name == 'workflow_dispatch' && inputs.history_backfill
        run: python3 scripts/backfill_star_history.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve per-repository backfill checkpoint
        if: always() && github.event_name == 'workflow_dispatch' && inputs.history_backfill
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: history-backfill-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/history-backfill/
          if-no-files-found: warn
          retention-days: 14
      - name: Collect, validate, render and publish current main
        id: publish
        run: |
          if [ "$HISTORY_BACKFILL" = "true" ]; then
            python3 scripts/publish_readme.py --cached
          else
            python3 scripts/publish_readme.py
          fi
          echo "build_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HISTORY_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.history_backfill }}
      - name: Preserve unpublished chart observations on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chart-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/chart-observations/archive.json
          if-no-files-found: warn
          retention-days: 14
      - name: Build field guide from the accepted published revision
        run: python3 scripts/build_published_site.py --source-sha "$PUBLISHED_SHA" --output tmp/site
        env:
          PUBLISHED_SHA: ${{ steps.publish.outputs.published_sha }}
      # Report only: PR CI enforces the budget, and a daily publish must not stall.
      - name: Report the site size budget
        run: python3 scripts/check_budget.py tmp/site --warn-only
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          name: github-pages-${{ github.run_attempt }}
          path: tmp/site

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: publish-readme
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No checkout or repository-content write access in the deployment job.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require an artifact built in this run attempt
        env:
          BUILD_ATTEMPT: ${{ needs.publish-readme.outputs.build_attempt }}
          PUBLISHED_SHA: ${{ needs.publish-readme.outputs.published_sha }}
        run: |
          if [ "$BUILD_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo "::error::Re-run all jobs to rebuild current main; a deployment-only retry could publish an older artifact."
            exit 1
          fi
          printf 'Published catalog revision: [%s](https://github.com/%s/commit/%s)\n' "$PUBLISHED_SHA" "$GITHUB_REPOSITORY" "$PUBLISHED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy field guide to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
