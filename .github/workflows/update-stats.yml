name: Update Dynamic Text

on:
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-stats
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check updater
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Fetch repository data and update README
        run: python3 scripts/update_stats.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh HN history monthly and render cached charts
        run: python3 scripts/update_hn.py

      - name: Commit and push changes
        run: |
          if git diff --quiet -- README.md data/hn_evidence.json assets/hn; then
            echo "No metadata or HN chart changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/hn_evidence.json assets/hn
          git commit -m "chore: update dynamic README text [skip ci]"
          git push
