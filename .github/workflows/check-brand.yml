name: Brand reference integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  brand:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check brand assets, skill pins and reference files
        run: python3 scripts/check_brand.py
      - name: Flag undocumented design changes for review
        if: github.event_name == 'pull_request'
        env:
          BRAND_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_brand.py --base "$BRAND_BASE_SHA"
